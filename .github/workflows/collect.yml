name: Collect reading

on:
  schedule:
    # Every 10 minutes during gym hours. Times are UTC, and the range
    # covers 6am–midnight Eastern in both EST and EDT; app.collect also
    # checks the local time and exits early if the gym is closed.
    #
    # GitHub's minimum is 5 minutes, and scheduled runs are queued at
    # best effort — expect real gaps of 10–20 minutes under load.
    - cron: "*/10 10-23,0-5 * * *"
  # Lets you trigger a run by hand from the Actions tab, which is how
  # you'll test this the first time.
  workflow_dispatch:

# Needed to push the new reading back to the repo.
permissions:
  contents: write

# If a run is somehow still going when the next fires, let it finish
# rather than pushing two commits that conflict.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-collect.txt

      - name: Install dependencies
        # The CPU-only PyTorch wheel is a fraction of the size of the
        # default one, which bundles CUDA for GPUs this runner lacks.
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r backend/requirements-collect.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: backend/yolov8s.pt
          key: yolov8s-weights

      - name: Take a reading
        working-directory: backend
        run: python -m app.collect

      - name: Commit the reading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # Nothing to commit when the gym is closed and the run exited early.
          git diff --staged --quiet || git commit -m "reading: $(date -u +%H:%M)"
          # Another run may have pushed while this one was working.
          git pull --rebase --autostash
          git push
