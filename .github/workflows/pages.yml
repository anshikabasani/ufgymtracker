name: Deploy site

on:
  push:
    branches: [main]
    # Only rebuild when the site itself changes. Without this filter,
    # every 10-minute data commit would trigger a deploy.
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          # The site is served from /<repo>/ on github.io, so asset URLs
          # need that prefix.
          VITE_BASE: "/${{ github.event.repository.name }}/"
          # Readings are fetched straight from the repo — no API server.
          VITE_DATA_BASE: "https://raw.githubusercontent.com/${{ github.repository }}/main/data"
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v4
