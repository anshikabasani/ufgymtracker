name: Debug TLS

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: What certificate does the runner actually get?
        run: |
          echo "=== chain as seen from this runner ==="
          echo | openssl s_client -connect recsports.ufl.edu:443 \
            -servername recsports.ufl.edu -showcerts 2>/dev/null \
            | grep -E "^ *[0-9]+ (s|i):" || echo "(no chain returned)"

          echo "=== verify result ==="
          echo | openssl s_client -connect recsports.ufl.edu:443 \
            -servername recsports.ufl.edu 2>&1 | grep -i "verify return code"

          echo "=== resolves to ==="
          getent hosts recsports.ufl.edu || true

          echo "=== plain curl ==="
          curl -sS -o /dev/null -w "http_code=%{http_code}\n" \
            https://recsports.ufl.edu/cam/cam8.jpg || echo "curl failed"
